<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5ef" />
    <title>砚白 · Inkstone</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-theme="eink" data-font="serif">
    <!-- ============ 书架 ============ -->
    <section id="shelf" class="screen">
      <header class="shelf-head">
        <h1>砚白 · Inkstone</h1>
        <p class="subtitle">本地优先 · 墨水屏优化 · 无广告 · 零联网</p>
      </header>
      <div class="shelf-actions">
        <button id="import-txt" class="btn">＋ 导入 TXT</button>
        <button id="import-epub" class="btn">＋ 导入 EPUB</button>
        <button id="import-pdf" class="btn">＋ 导入 PDF</button>
        <button id="import-mobi" class="btn">＋ 导入 MOBI</button>
        <button id="open-sample" class="btn btn-ghost">读示例书</button>
        <input type="file" id="file-txt" accept=".txt,text/plain" hidden />
        <input type="file" id="file-epub" accept=".epub,application/epub+zip" hidden />
        <input type="file" id="file-pdf" accept=".pdf,application/pdf" hidden />
        <input type="file" id="file-mobi" accept=".mobi,.azw,application/x-mobipocket-ebook" hidden />
      </div>
      <div id="book-list" class="book-list"></div>
      <div id="drop-hint" class="drop-hint">把 .txt / .epub / .pdf / .mobi / .azw 拖到这里导入 · AZW3/KFX 请用 Calibre 转成 EPUB 再导入</div>
    </section>

    <!-- ============ 阅读器 ============ -->
    <section id="reader" class="screen hidden">
      <div id="topbar" class="topbar">
        <button id="btn-back" class="icon-btn">← 书架</button>
        <div id="chapter-title" class="chapter-title"></div>
        <button id="btn-toc-top" class="icon-btn">目录</button>
      </div>

      <div id="page-viewport" class="page-viewport">
        <div id="page" class="page"></div>
      </div>

      <div id="bottombar" class="bottombar">
        <button id="btn-prev" class="icon-btn">‹ 上一页</button>
        <div id="progress" class="progress"></div>
        <button id="btn-next" class="icon-btn">下一页 ›</button>
        <span class="bar-sep"></span>
        <button id="btn-bookmark" class="icon-btn">书签</button>
        <button id="btn-toc" class="icon-btn">目录</button>
        <button id="btn-settings" class="icon-btn">设置</button>
      </div>

      <!-- 侧滑面板 -->
      <aside id="panel-toc" class="panel">
        <div class="panel-head"><span>目录</span><button class="panel-close" data-close="panel-toc">✕</button></div>
        <div id="toc-list" class="toc-list"></div>
      </aside>
      <aside id="panel-bookmark" class="panel">
        <div class="panel-head"><span>书签</span><button class="panel-close" data-close="panel-bookmark">✕</button></div>
        <button id="bm-add" class="btn" style="margin:12px 16px; width:calc(100% - 32px)">＋ 标记当前页</button>
        <div id="bookmark-list" class="bookmark-list"></div>
      </aside>
      <aside id="panel-settings" class="panel">
        <div class="panel-head"><span>阅读设置</span><button class="panel-close" data-close="panel-settings">✕</button></div>
        <div class="settings-body">
          <div class="field">
            <label>主题</label>
            <div class="seg" id="seg-theme">
              <button data-val="eink">墨水屏</button>
              <button data-val="light">纸白</button>
              <button data-val="sepia">护眼</button>
              <button data-val="dark">夜间</button>
              <button data-val="paper">纯白</button>
            </div>
          </div>
          <div class="field">
            <label>字体</label>
            <div class="seg" id="seg-font">
              <button data-val="serif">衬线</button>
              <button data-val="sans">黑体</button>
              <button data-val="mono">等宽</button>
            </div>
          </div>
          <div class="field">
            <label>字号 <span id="val-fontsize"></span></label>
            <input type="range" id="set-fontsize" min="16" max="32" step="1" />
          </div>
          <div class="field">
            <label>行距 <span id="val-lineheight"></span></label>
            <input type="range" id="set-lineheight" min="1.2" max="2.4" step="0.05" />
          </div>
          <div class="field">
            <label>边距 <span id="val-margin"></span></label>
            <input type="range" id="set-margin" min="8" max="56" step="1" />
          </div>
          <div class="field">
            <label>段距 <span id="val-paraspacing"></span></label>
            <input type="range" id="set-paraspacing" min="0" max="1.6" step="0.1" />
          </div>
          <div class="field">
            <label>字间距(px) <span id="val-letterspacing"></span></label>
            <input type="range" id="set-letterspacing" min="-1" max="4" step="0.5" />
          </div>
          <div class="field row">
            <label class="switch"><input type="checkbox" id="set-justify" /> 两端对齐</label>
            <label class="switch"><input type="checkbox" id="set-indent" /> 首行缩进</label>
          </div>
          <div class="field">
            <label>整屏刷新（墨水屏清残影）</label>
            <div class="seg" id="seg-regal">
              <button data-val="0">关闭</button>
              <button data-val="1">每页</button>
              <button data-val="3">每3页</button>
              <button data-val="6">每6页</button>
              <button data-val="12">每12页</button>
              <button data-val="999">每章</button>
            </div>
          </div>
          <div class="field">
            <label>翻译（中英互译，默认关闭）</label>
            <div class="seg" id="seg-translate-provider">
              <button data-val="none">关闭</button>
              <button data-val="mock">演示</button>
              <button data-val="deepl">DeepL</button>
              <button data-val="google">Google</button>
              <button data-val="llm">AI 大模型</button>
            </div>
          </div>
          <div class="field" id="field-tkey">
            <label>API Key（仅存本机）</label>
            <input type="password" id="set-tkey" placeholder="填入对应提供方的 Key" autocomplete="off" />
          </div>
          <div class="field" id="field-tbase">
            <label>AI 接口地址 / 模型</label>
            <input type="text" id="set-tbase" placeholder="https://api.openai.com/v1" style="margin-bottom:8px" autocomplete="off" />
            <input type="text" id="set-tmodel" placeholder="模型名，如 gpt-4o-mini" autocomplete="off" />
          </div>
          <div class="field">
            <label>默认方向</label>
            <div class="seg" id="seg-tdir">
              <button data-val="auto">自动</button>
              <button data-val="zh2en">中→英</button>
              <button data-val="en2zh">英→中</button>
            </div>
          </div>
          <p class="hint">翻译默认关闭，不影响离线阅读。启用后，在阅读页选中文字即可「译」。API Key 仅保存在本机，不会上传到任何阅读器服务器（本应用无服务器）。AI 大模型支持任意 OpenAI 兼容接口（如 DeepSeek / 通义 / 本地 Ollama）。</p>
        </div>
      </aside>
      <div id="panel-mask" class="panel-mask"></div>

      <!-- Regal 整屏清残影闪光 -->
      <div id="refresh-flash" class="refresh-flash"></div>

      <!-- 选中文字翻译 -->
      <button id="translate-fab" class="hidden">译</button>
      <div id="translate-pop" class="hidden">
        <div class="tp-row">
          <span id="translate-dir" class="tp-dir"></span>
          <button id="translate-swap" class="hidden">⇄ 反向</button>
        </div>
        <div id="translate-result"></div>
        <div class="tp-actions">
          <button id="translate-copy" class="hidden">复制</button>
          <button id="translate-close">关闭</button>
        </div>
      </div>
    </section>

    <!-- EPUB 解压库（UMD 全局 fflate） -->
    <script src="js/vendor/fflate.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
